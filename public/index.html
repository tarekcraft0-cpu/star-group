<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STAR — قروب ستار</title>
    <meta name="description" content="موقع قروب ستار — تقييم الأدمنية وآراء الأعضاء" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>

    <header class="hero">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-sparks" aria-hidden="true"></div>
      <figure class="logo-ring">
        <img src="/assets/star-logo.png" alt="شعار قروب ستار" width="200" height="200" />
      </figure>
      <h1 class="brand">STAR</h1>
      <p class="brand-ar">ستار</p>
      <p class="tagline">أعلى التقييمات · اضغط على أي اسم ينقلك عنده</p>
      <div id="top-rated" class="top-rated" aria-label="أعلى 3 تقييمات"></div>
      <div id="roster" class="roster" aria-label="باقي الأدمنية"></div>
      <a class="cta" href="#admins-title">شوف كل الآراء</a>
    </header>

    <main class="shell">
      <section class="feed" aria-labelledby="admins-title">
        <div class="feed-head">
          <h2 id="admins-title">الأدمنية والآراء</h2>
          <p>الآراء ظاهرة للجميع تحت كل شخص مباشرة.</p>
        </div>
        <div id="admins" class="admin-grid"></div>
      </section>
    </main>

    <footer class="footer">
      <span class="footer-brand">STAR</span>
      <span>قروب ستار</span>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
